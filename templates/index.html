<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroSmart</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Poppins:wght@300;600&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #c6f6d5, #68d391);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
            padding: 10px;
            transition: background 0.3s ease;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://source.unsplash.com/random/1920x1080?leaves') no-repeat center center fixed;
            background-size: cover;
            opacity: 0.15;
            z-index: 0;
            transition: opacity 0.3s ease;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 15px;
        }
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.25);
        }
        .moisture-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .moisture-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .circle-progress {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            animation: fadeIn 0.5s ease-in-out;
        }
        .circle-progress svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        .circle-progress circle {
            fill: none;
            stroke-width: 8;
            stroke: rgba(255, 255, 255, 0.4);
        }
        .circle-progress .fg {
            stroke: #ecc94b;
            stroke-linecap: round;
            transition: stroke-dasharray 0.5s ease;
        }
        .circle-progress span {
            position: absolute;
            top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.5rem;
    color: #fff;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    text-align: center;
    line-height: 1;
    animation: pulse 1.5s infinite;
}
        .status-btn {
            background: #a0aec0;
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            max-width: 180px;
        }
        .status-btn.active {
            background: #ecc94b;
            transform: scale(1.05);
        }
        .toggle-btn {
            background: #2f855a;
            color: #fff;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            max-width: 180px;
        }
        .toggle-btn:hover {
            background: #276749;
            transform: translateY(-2px) scale(1.05);
        }
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .theme-toggle {
            background: #ecc94b;
            color: #2d3748;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .theme-toggle:hover {
            background: #d69e2e;
            transform: scale(1.05);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #a0aec0;
            display: inline-block;
            margin-right: 8px;
            transition: background-color 0.3s ease;
        }
        .dark-mode {
            background: linear-gradient(135deg, #4a5568, #2d3748);
        }
        .dark-mode .card {
            background: rgba(60, 60, 60, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .dark-mode .circle-progress circle {
            stroke: rgba(255, 255, 255, 0.3);
        }
        .dark-mode .circle-progress .fg {
            stroke: #48bb78;
        }
        .dark-mode .status-btn {
            background: #718096;
        }
        .dark-mode .status-btn.active {
            background: #48bb78;
        }
        .dark-mode .toggle-btn {
            background: #48bb78;
        }
        .dark-mode .toggle-btn:hover {
            background: #2f855a;
        }
        .dark-mode .theme-toggle {
            background: #f6e05e;
        }
        .dark-mode .theme-toggle:hover {
            background: #d4af37;
        }
        .dark-mode .header {
            background: rgba(40, 40, 40, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .dark-mode .status-dot {
            background: #718096;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        @media (min-width: 768px) {
            .container { max-width: 900px; padding: 20px; }
            .header { flex-direction: row; justify-content: space-between; padding: 15px; }
            .card { padding: 25px; }
            .circle-progress { width: 150px; height: 150px; }
            .circle-progress span { font-size: 2rem; }
            h1 { font-size: 2.5rem; }
            .status-btn, .toggle-btn { font-size: 1.1rem; padding: 12px 25px; max-width: 220px; }
            .theme-toggle { font-size: 1rem; padding: 10px 20px; }
        }
        @media (max-width: 576px) {
            h1 { font-size: 1.8rem; }
            .card { padding: 15px; margin-bottom: 15px; }
            .moisture-card { padding: 15px; }
            .circle-progress { width: 90px; height: 90px; }
            .circle-progress span { font-size: 1.2rem; }
            .status-btn, .toggle-btn { font-size: 0.9rem; padding: 8px 15px; max-width: 140px; }
            .theme-toggle { font-size: 0.8rem; padding: 6px 12px; }
            .header { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="text-3xl font-bold text-white">HydroSmart</h1>
            <div class="flex items-center space-x-4">
                <button id="theme_toggle" class="theme-toggle">🌙 Dark Mode</button>
                <div class="flex items-center">
                    <span class="status-dot"></span>
                    <span id="status_text" class="text-sm">Menghubungkan...</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Kelembaban Tanah -->
            <div class="card moisture-card">
                <div class="moisture-header">
                    <i class="fas fa-droplet text-2xl text-blue-300"></i>
                    <h3 class="text-lg font-semibold text-white">Kelembaban Tanah</h3>
                </div>
                <div class="circle-progress">
                    <svg width="120" height="120">
                        <circle cx="60" cy="60" r="50" class="circle-progress circle"></circle>
                        <circle id="moisture_circle" cx="60" cy="60" r="50" class="fg" stroke-dasharray="0 314"></circle>
                    </svg>
                    <span id="moisture_percent">0%</span>
                </div>
                <p id="moisture" class="text-sm mt-2">Memuat...</p>
            </div>

            <!-- Status Pompa -->
            <div class="card">
                <i class="fas fa-water text-2xl text-blue-300 mb-3"></i>
                <h3 class="text-lg font-semibold text-white mb-2">Status Pompa</h3>
                <button id="pump_status" class="status-btn">Memuat...</button>
            </div>

            <!-- Mode Otomatis -->
            <div class="card">
                <i class="fas fa-sun text-2xl text-yellow-300 mb-3"></i>
                <h3 class="text-lg font-semibold text-white mb-2">Mode Otomatis</h3>
                <button id="auto_mode" class="status-btn mb-3">Memuat...</button>
                <button id="toggle_button" class="toggle-btn">Ganti Mode</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io('http://20.2.86.242:5000');
        let current_auto_mode = false;

        // Dark mode toggle
        const themeToggle = document.getElementById('theme_toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggle.innerText = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        // Load theme from localStorage
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.innerText = '☀️ Light Mode';
        }

        socket.on('connect', function() {
            document.querySelector('.status-dot').style.background = '#48bb78';
            document.getElementById('status_text').innerText = "Tersambung";
        });

        socket.on('disconnect', function() {
            document.querySelector('.status-dot').style.background = '#e53e3e';
            document.getElementById('status_text').innerText = "Terputus";
        });

        socket.on('update', function(data) {
            const moisture = parseInt(data.moisture);
            const percentage = (moisture / 1024) * 100;
            const circumference = 314; // 2 * π * 50
            const offset = (percentage / 100) * circumference;
            document.getElementById('moisture_circle').setAttribute('stroke-dasharray', `${offset} ${circumference}`);
            document.getElementById('moisture_percent').innerText = `${percentage.toFixed(1)}%`;
            document.getElementById('moisture').innerText = `Nilai: ${moisture}`;

            const pumpStatus = document.getElementById('pump_status');
            pumpStatus.innerText = data.pump_status ? 'NYALA' : 'MATI';
            pumpStatus.className = data.pump_status ? 'status-btn active' : 'status-btn';

            current_auto_mode = data.auto_mode;
            const autoMode = document.getElementById('auto_mode');
            autoMode.innerText = data.auto_mode ? 'Aktif' : 'Nonaktif';
            autoMode.className = data.auto_mode ? 'status-btn active mb-3' : 'status-btn mb-3';
        });

        document.getElementById('toggle_button').addEventListener('click', function() {
            const new_state = !current_auto_mode;
            socket.emit('set_auto_mode', new_state);
        });
    </script>
</body>
</html>
